<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cita San Valentín 💘</title>
<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(120deg, #FFC1CC, #FF8AB8);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: #fff;
}

h1 {
    margin-bottom: 40px;
    font-size: 5rem; /* aumentado de 2.5rem */
    text-shadow: 1px 1px 3px #B83280;
}

.game-card {
    background: rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 25px 40px; /* ligeramente más grande para equilibrar */
    margin: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
    font-size: 1.5rem; /* aumentado de tamaño normal */
}

.game-card:hover {
    transform: scale(1.05);
    background: rgba(255,255,255,0.35);
}

.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    color: #333;
    padding: 35px; /* más espacioso */
    border-radius: 16px;
    box-shadow: 0px 4px 20px rgba(0,0,0,0.4);
    display: none;
    max-width: 400px;
    text-align: center;
}

.popup a {
    display: block;
    margin: 15px 0;
    padding: 12px 25px; /* más grande para que sea cómodo hacer clic */
    background: #FF69B4;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 1.3rem; /* aumentado */
}

.close-btn {
    margin-top: 25px;
    padding: 7px 15px;
    cursor: pointer;
    background: #ccc;
    color: #333;
    border-radius: 8px;
    font-size: 1.2rem; /* más grande */
}

</style>
</head>
<body>
<h1>Cita San Valentín  💖</h1>

<div class="game-card" onclick="openPopup('Dibujar y Adivinar', 'https://skribbl.io/')">
    🎨 Dibujos
</div>

<div class="game-card" onclick="openPopup('Ruleta sorpresa', 'https://spinwheelify.com/es')">
    💞 Ruleta sorpresa
</div>

<div class="game-card" onclick="openMostLikely()">
    💭 Quién es más probable que
</div>

<div class="popup" id="popup">
    <h2 id="popup-title"></h2>
    <div id="popup-links"></div>
    <div class="close-btn" onclick="closePopup()">Cerrar</div>
</div>

<script>
function openPopup(title, url){
    document.getElementById('popup-title').innerText = title;
    document.getElementById('popup-links').innerHTML = `<a href="${url}" target="_blank">Jugar</a>`;
    document.getElementById('popup').style.display = 'block';
}

function closePopup(){
    document.getElementById('popup').style.display = 'none';
}

// Popup especial para "Quién es más probable que"
function openMostLikely(){
    document.getElementById('popup-title').innerText = 'Quién es más probable que';
    document.getElementById('popup-links').innerHTML = `
        <a href="https://www.votemostlikely.com/" target="_blank">Opción 1</a>
        <a href="https://mostlikelyto.app/" target="_blank">Opción 2</a>
    `;
    document.getElementById('popup').style.display = 'block';
}
</script>
</body>
</html>
